[project]
name = "vitlab"
version = "0.1.0"
description = "Yes, its a pun."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=5.0",
    "safetensors>=0.4",
    "peft>=0.11",
    "accelerate>=0.30",
    "huggingface-hub>=0.23",
    "datasets>=2.19",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8,<3.11",
    "scipy>=1.15.3",
    "overcomplete>=0.3.0",
]

[project.scripts]
vitlab = "vitlab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

interp = [
    "overcomplete>=0.2",
    "nnsight>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
